<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="StrongBloom">
<meta name="theme-color" content="#FDF6F8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<title>StrongBloom · Workout Planner & Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FDF6F8; --surface:#FFFFFF; --ink:#2B1A33; --ink2:#75627B; --line:#EFDFE6;
  --rose:#D4476F; --rose-press:#B93A5E; --blush:#F8E1E7; --lilac:#EEE6F6; --lilac2:#D9CBEA;
  --gold:#A9823D; --gold-bg:#F6EEDC; --hero:#2B1A33; --hero-ink:#FBEFF3; --hero-ink2:#CDB6CF;
  --font:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1120; --surface:#251A2C; --ink:#F7ECF1; --ink2:#B7A3BD; --line:#3A2C43;
    --rose:#EC6A90; --rose-press:#D95781; --blush:#3A2233; --lilac:#2A2138; --lilac2:#4A3C5E;
    --gold:#D9B26A; --gold-bg:#3A2F1E; --hero:#34203E; --hero-ink:#FBEFF3; --hero-ink2:#CDB6CF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1120; --surface:#251A2C; --ink:#F7ECF1; --ink2:#B7A3BD; --line:#3A2C43;
  --rose:#EC6A90; --rose-press:#D95781; --blush:#3A2233; --lilac:#2A2138; --lilac2:#4A3C5E;
  --gold:#D9B26A; --gold-bg:#3A2F1E; --hero:#34203E; --hero-ink:#FBEFF3; --hero-ink2:#CDB6CF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--rose);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding:0 20px 40px;position:relative;min-height:100vh}
body.tabs .app{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--ink2)} .small{font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px;gap:12px;min-height:60px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px;color:var(--rose)}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.back svg{width:20px;height:20px}
.top-t{font-weight:700;font-size:17px;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-sp{width:42px;flex:none}
.display{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.035em;font-variation-settings:'opsz' 96}
.h2{font-size:24px;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.sec-t{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:30px 0 10px}
p+p{margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 22px;border-radius:999px;background:var(--rose);color:#fff;font-weight:700;font-size:17px;text-align:center;transition:transform .12s, background .12s}
.btn:active{transform:scale(.98);background:var(--rose-press)}
.btn.soft{background:var(--blush);color:var(--ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{min-height:44px;font-size:15px;width:auto}
.linkbtn{color:var(--rose);font-weight:650;padding:10px 0;display:inline-block}
.cta{position:sticky;bottom:0;padding:18px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom, transparent, var(--bg) 35%);margin-top:18px;z-index:5}

/* intro + program list */
.intro{padding:18px 0 6px}
.intro p{margin-top:14px;max-width:34ch}
.plist{margin-top:14px;border-top:1px solid var(--line)}
.prog{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;padding:18px 0;border-bottom:1px solid var(--line);align-items:center}
.prog-n{font-size:22px;font-weight:750;letter-spacing:-.02em;grid-column:1}
.prog-b{color:var(--ink2);grid-column:1;font-size:15px;max-width:46ch}
.prog-m{grid-column:1;font-size:14px;font-weight:600;margin-top:4px}
.prog-go{grid-column:2;grid-row:1/4;width:36px;height:36px;border-radius:50%;background:var(--blush);display:grid;place-items:center}
.prog-go svg{width:18px;height:18px}
.tag{display:inline-block;background:var(--rose);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:4px}

/* today */
.wkhead{padding:10px 0 0}
.wkhead .display{margin-top:4px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:20px 0 22px}
.sd{display:flex;flex-direction:column;align-items:center;gap:6px}
.sd b{width:100%;aspect-ratio:1;max-width:46px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700;border:1.5px solid var(--line);background:var(--surface)}
.sd span{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sd.off b{background:transparent;border-style:dashed;color:var(--ink2);font-weight:500}
.sd.done b{background:var(--rose);border-color:var(--rose);color:#fff}
.sd.nx b{border:2.5px solid var(--ink);}
.next{background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:24px 22px 18px;position:relative;overflow:hidden}
.next::after{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;border:26px solid rgba(236,106,144,.22)}
.next-k{color:var(--hero-ink2);font-size:15px;font-weight:600}
.next h2{font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:6px 0 18px;max-width:14ch;position:relative;z-index:1}
.stats{display:flex;gap:26px;margin-bottom:20px}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:26px;font-weight:700;line-height:1}
.stats span{font-size:13px;color:var(--hero-ink2);margin-top:4px}
.next .linkbtn{color:var(--hero-ink);display:block;text-align:center;width:100%;margin-top:6px}
.resume{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--gold-bg);border-radius:20px;padding:14px 16px;margin:8px 0 14px;gap:12px}
.pill{background:var(--ink);color:var(--bg);font-weight:700;border-radius:999px;padding:8px 16px;font-size:14px;flex:none}
.rows{border-top:1px solid var(--line);margin-top:22px}
.lrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 0;border-bottom:1px solid var(--line);font-weight:600}
.lrow svg{width:18px;height:18px;color:var(--ink2)}
.meter{height:6px;border-radius:6px;background:var(--blush);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--rose);border-radius:6px}

/* builder */
.field{margin-top:26px}
.field>label{display:block;font-weight:700;margin-bottom:10px}
.seg{display:flex;background:var(--blush);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;min-height:48px;border-radius:12px;font-weight:650;text-align:center}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(43,26,51,.12)}
.hint{font-size:14px;color:var(--ink2);margin-top:8px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.days button{border:1.5px solid var(--line);border-radius:18px;padding:12px 0 10px;text-align:center;background:var(--surface)}
.days b{display:block;font-size:30px;font-weight:700;line-height:1}
.days span{font-size:13px;color:var(--ink2)}
.days button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.days button.on span{color:var(--bg);opacity:.75}

/* schedule rows */
.drow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;width:100%;padding:13px 0;border-bottom:1px solid var(--line)}
.dnum{text-align:center;line-height:1}
.dnum b{display:block;font-size:28px;font-weight:400;color:var(--rose)}
.dnum span{font-size:12px;font-weight:700;color:var(--rose)}
.dname{font-weight:700;font-size:17px;line-height:1.2}
.dsub{font-size:14px;color:var(--ink2)}
.drow.off .dname{font-weight:500;color:var(--ink2)}
.drow.off .dnum b,.drow.off .dnum span{color:var(--ink2)}
.ck{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--rose);color:#fff}
.ck svg{width:15px;height:15px}
.chev{width:18px;height:18px;color:var(--ink2)}
.week{border-bottom:1px solid var(--line)}
.wbtn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:18px 0}
.wbtn b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.wbtn .wr{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:14px}
.wbtn svg{width:18px;height:18px;transition:transform .2s}
.week.open .wbtn svg{transform:rotate(180deg)}
.week .drow:last-child{border-bottom:0}
.wbody{padding-bottom:10px}

/* workout detail */
.meta{display:flex;gap:26px;flex-wrap:wrap;margin:18px 0 6px}
.meta div{display:flex;flex-direction:column}
.meta b{font-size:22px;font-weight:650;line-height:1.1}
.meta span{font-size:13px;color:var(--ink2);margin-top:3px}
.eq{margin-top:14px;font-size:15px}
.eq b{font-weight:700}
.xrow{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:15px 0;border-bottom:1px solid var(--line)}
.xi{font-size:15px;font-weight:700;color:var(--rose);padding-top:2px}
.xn{font-weight:700;font-size:17px;line-height:1.25}
.xs{font-size:14px;color:var(--ink2);margin-top:3px}
.swapbtn{font-size:14px;font-weight:650;color:var(--rose);background:var(--blush);border-radius:999px;padding:7px 12px;display:flex;gap:5px;align-items:center}
.swapbtn svg{width:14px;height:14px}
.donebadge{display:inline-flex;align-items:center;gap:6px;background:var(--blush);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;margin-top:12px}

/* player */
.pl-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.txtbtn{font-weight:700;color:var(--rose);padding:8px 4px;min-width:60px}
.elapsed{font-size:20px;font-weight:700;letter-spacing:.02em}
.pl-count{min-width:60px;text-align:right;font-size:14px;color:var(--ink2)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose);transition:width .3s}
.work{padding-top:22px}
.ex-n{font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:6px 0 8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 10px 12px;text-align:center}
.tile b{display:block;font-size:46px;font-weight:400;line-height:1;color:var(--rose);letter-spacing:-.02em}
.tile span{font-size:13px;font-weight:700;color:var(--rose)}
.cue{background:var(--lilac);border-radius:16px;padding:12px 14px;font-size:15px}
.log{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.lg label{display:block;font-size:14px;font-weight:650;margin-bottom:6px}
.stepper{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;height:56px;overflow:hidden}
.stepper button{width:44px;height:100%;font-size:24px;font-weight:500;color:var(--rose);text-align:center;flex:none}
.lg{min-width:0}
.stepper input{flex:1;min-width:0;width:100%;height:100%;border:0;background:transparent;text-align:center;font-size:22px;font-weight:700;outline:none}
.last{grid-column:1/3;font-size:14px;color:var(--ink2)}
.pl-actions{margin-top:18px}
.pl-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pl-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;font-size:13px;font-weight:650;color:var(--ink2);border-radius:14px}
.pl-nav button svg{width:22px;height:22px;color:var(--rose)}
.ringwrap{position:relative;width:min(78vw,280px);aspect-ratio:1;margin:8px auto 0}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{stroke:var(--lilac2);fill:none}
.ring-fg{stroke:var(--rose);fill:none;stroke-linecap:round}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c b{font-size:78px;font-weight:300;letter-spacing:-.04em;line-height:1;color:var(--ink)}
.ring-c span{font-size:15px;font-weight:700;color:var(--rose);margin-top:4px}
.rest{background:var(--lilac);margin:14px -20px 0;padding:26px 20px 24px;border-radius:32px;text-align:center}
.rest-l{font-size:24px;font-weight:800;letter-spacing:-.02em}
.rest-ctl{display:flex;justify-content:center;align-items:center;gap:22px;margin:18px 0 18px}
.circ{width:62px;height:62px;border-radius:50%;border:1.5px solid var(--lilac2);display:grid;place-items:center;font-weight:700;font-size:16px;background:var(--surface);color:var(--ink)}
.circ.big{width:78px;height:78px;background:var(--ink);color:var(--bg);border:0}
.circ svg{width:28px;height:28px}
.upnext{margin-top:16px;border:1.5px solid var(--line);border-radius:24px;padding:16px 18px;background:var(--surface)}
.upnext h3{font-size:21px;font-weight:750;letter-spacing:-.02em;line-height:1.15;margin:2px 0 4px}
.chip{display:inline-block;background:var(--blush);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:650}
.switchhint{font-size:15px;font-weight:700;color:var(--rose);min-height:22px;margin-top:6px;text-align:center}

/* summary */
.sum{padding-top:40px}
.bloom{width:84px;height:84px;color:var(--rose);margin-bottom:18px}
.bigstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0}
.bigstats div{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 12px}
.bigstats b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.bigstats span{font-size:13px;color:var(--ink2)}
.pr{display:flex;justify-content:space-between;align-items:center;background:var(--gold-bg);border-radius:16px;padding:12px 14px;margin-top:8px}
.pr b{color:var(--gold)}

/* progress */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.kpi b{display:block;font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.kpi span{font-size:13.5px;color:var(--ink2)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 12px 10px}
.chart svg{width:100%;height:auto;display:block}
.pbrow{display:grid;grid-template-columns:1fr 84px;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.pbrow svg{width:84px;height:30px}
.hrow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:22px;padding:22px;text-align:center;color:var(--ink2);margin-top:16px}

/* settings */
.srow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.srow .st{font-weight:650}
.srow .sd2{font-size:14px;color:var(--ink2);margin-top:2px}
.sw{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--rose)}
.sw.on::after{transform:translateX(20px)}
.mini-seg{display:flex;background:var(--blush);border-radius:12px;padding:3px;flex:none}
.mini-seg button{padding:7px 12px;border-radius:9px;font-size:14px;font-weight:650}
.mini-seg button.on{background:var(--surface)}
.note{background:var(--lilac);border-radius:18px;padding:14px 16px;font-size:14.5px;margin-top:12px}
.danger{color:#C2334E}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:none}
body.tabs .tabbar{display:block}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:650;color:var(--ink2);border-radius:14px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--rose)}

/* sheet (nested in .app to avoid stacking bug) */
.scrim{position:fixed;inset:0;background:rgba(26,17,32,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.opt{display:block;width:100%;padding:14px 0;border-bottom:1px solid var(--line)}
.opt b{display:block;font-size:17px}
.opt span{font-size:14px;color:var(--ink2)}
.opt.cur b{color:var(--rose)}
.sheet .btn+.btn{margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:650;font-size:15px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:600px){.display{font-size:46px}}
</style>
</head>
<body class="tabs">
<div class="app">
  <main id="main"></main>
  <div class="scrim" id="scrim" data-a="closeSheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="tabbar"><nav id="tabs"></nav></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ============ DATA ============ */
// [id, name, pattern, loc(g/h), equipment, muscles, type(r=reps,s=seconds), unilateral, cue]
const EXR = [
['bht','Barbell hip thrust','hipthrust','g','Barbell, bench','Glutes, hamstrings','r',0,'Upper back on the bench, chin tucked. Drive through your heels and lock out with a hard squeeze.'],
['sht','Smith machine hip thrust','hipthrust','g','Smith machine, bench','Glutes','r',0,'Bar over your hip crease. Push up until your shins are vertical and pause for one second.'],

/* ============ PROGRAM LOGIC ============ */
function pick(p, code, v, used){
  const list = EX.filter(e=>e.p===p && e.loc.includes(code));
  for(let k=0;k<list.length;k++){ const e=list[(v+k)%list.length]; if(!used.has(e.id)) return e; }
  return list[v%list.length];
}
function buildDay(progId, loc, dayKey, week){
  const T=D[dayKey], code=lc(loc), used=new Set();
  return T.s.map((sl,i)=>{
    const [p,s,r,rest,v]=sl;
    const sw = S.swaps[`${progId}|${loc}|${dayKey}|${i}`];
    let ex = (sw && EXM[sw] && EXM[sw].p===p && EXM[sw].loc.includes(code)) ? EXM[sw] : pick(p,code,v,used);
    used.add(ex.id);
    let sets=s;
    if(week>=4 && week<=7 && i<2) sets=s+1;
    if(week===8) sets=Math.max(2,s-1);
    return {slot:i, p, id:ex.id, sets, reps:r, rest, sec: ex.id==='wsi'?45:40};
  });
}
function estMin(items){
  const secs = items.reduce((a,it)=>{ const e=EXM[it.id]; const work=(e.t==='s'?it.sec:40)*(e.u?2:1); return a + it.sets*(work+it.rest); },0);
  return Math.max(15, Math.round((secs/60+4)/5)*5);
}
function weekDays(progId, n){
  const keys=P[progId].days[n]; let t=0;
  return LAYOUT[n].map((on,i)=> on ? {day:i+1,key:keys[t++]} : {day:i+1,rest:true});
}
function nextWorkout(){
  const a=S.active; if(!a) return null;
  for(let w=1;w<=WEEKS;w++) for(const d of weekDays(a.id,a.days)) if(!d.rest && !a.done[`w${w}d${d.day}`]) return {week:w,day:d.day,key:d.key};
  return null;
}
function equipment(items){
  const set=new Set(); items.forEach(it=>EXM[it.id].eq.split(', ').forEach(x=>set.add(x.replace(/ or .*/,'').replace(/^Dumbbell$/,'Dumbbells')))); 
  return [...set].join(', ');
}
function repsLabel(it){ const e=EXM[it.id]; return e.t==='s' ? `${it.sec} sec${e.u?' each side':''}` : `${dash(it.reps)} reps${e.u?' each side':''}`; }
function lastLabel(id){ const l=S.last[id]; if(!l) return 'No previous log yet'; if(l.sec) return `Last time: ${l.sec} sec`; return `Last time: ${l.w!=null?l.w+' '+(l.u||S.units)+' × ':''}${l.r||'—'} reps`; }

let actx=null;
function unlockAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function tone(freq, dur, when=0, vol=.28){
  if(!S.sound || !actx) return;
  try{
    const t0=actx.currentTime+when, o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.015); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+.05);
  }catch(e){}
}
function chime(){ tone(660,.16,0); tone(880,.16,.18); tone(1175,.35,.36); if(S.vib && navigator.vibrate) navigator.vibrate([220,90,220]); }
function tick3(){ tone(740,.09,0,.18); }
function notify(title, body){
  if(!S.notify || !('Notification' in window) || Notification.permission!=='granted') return;
  const fallback=()=>{ try{ new Notification(title,{body,tag:'rest'}); }catch(e){} };
  if('serviceWorker' in navigator && navigator.serviceWorker.getRegistration){
    navigator.serviceWorker.getRegistration().then(r=>{ if(r) r.showNotification(title,{body,tag:'rest',renotify:true,icon:'icon-512.png'}); else fallback(); }).catch(fallback);
  } else fallback();
}

  const vol=H.filter(x=>x.u===S.units).reduce((a,x)=>a+x.vol,0);
  h+=`<div class="kpis"><div class="kpi"><b>${H.length}</b><span>workouts total</span></div><div class="kpi"><b>${thisWeek}</b><span>this week</span></div>
      <div class="kpi"><b>${mins>=120?(Math.round(mins/6)/10)+' h':mins+' min'}</b><span>time training</span></div><div class="kpi"><b>${fmtNum(vol)}</b><span>${S.units} lifted</span></div></div>`;
  // weekly chart
  const weeks=[]; for(let i=7;i>=0;i--){ const s=ws-i*7*864e5; weeks.push({s, n:H.filter(x=>x.at>=s && x.at<s+7*864e5).length}); }
  const mx=Math.max(3,...weeks.map(w=>w.n)), W=320, Hh=130, bw=26, gap=(W-bw*8)/7;
  h+=`<h2 class="sec-t">Workouts per week</h2><div class="chart"><svg viewBox="0 0 ${W} ${Hh+22}" role="img" aria-label="Workouts per week for the last 8 weeks">`+
    weeks.map((w,i)=>{ const bh=w.n? Math.max(8,(w.n/mx)*(Hh-22)) : 3; const x=i*(bw+gap), y=Hh-bh;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="7" fill="${i===7?'var(--rose)':'var(--lilac2)'}"/>${w.n?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${w.n}</text>`:''}<text x="${x+bw/2}" y="${Hh+16}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${new Date(w.s).getMonth()+1}/${new Date(w.s).getDate()}</text>`;}).join('')+`</svg></div>`;
  // bests
  const by={};
  [...H].reverse().forEach(x=>{ const top={};
    x.sets.forEach(s=>{ if(s.w==null||!s.w) return; if((s.u||x.u)!==S.units) return; if(!top[s.id]||s.w>top[s.id].w) top[s.id]={w:s.w,r:s.r}; });
    Object.entries(top).forEach(([id,v])=>{ (by[id]=by[id]||[]).push({at:x.at,w:v.w,r:v.r}); }); });
  const rows=Object.entries(by).sort((a,b)=>b[1][b[1].length-1].at - a[1][a[1].length-1].at).slice(0,12);
  if(rows.length){
    h+=`<h2 class="sec-t">Personal bests</h2>`+rows.map(([id,arr])=>{
      const best=arr.reduce((m,x)=>x.w>m.w?x:m,arr[0]); const pts=arr.slice(-8);
      const mn=Math.min(...pts.map(p=>p.w)), mxw=Math.max(...pts.map(p=>p.w));
      const path=pts.map((p,i)=>`${pts.length===1?42:i*(80/(pts.length-1))+2},${mxw===mn?15:26-((p.w-mn)/(mxw-mn))*22}`).join(' ');
      return `<div class="pbrow"><div><div class="xn">${esc(EXM[id]?EXM[id].n:id)}</div><div class="xs">Best ${best.w} ${S.units} × ${best.r||'—'}, ${arr.length} session${arr.length>1?'s':''}</div></div>
        <svg viewBox="0 0 84 30"><polyline points="${path}" fill="none" stroke="var(--rose)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;}).join('');
  }
  h+=`<h2 class="sec-t">History</h2>`+H.slice(0,40).map(x=>`<button class="hrow" data-a="histOpen" data-id="${x.id}"><span><span class="xn">${esc(x.title)}</span><br><span class="xs">${fmtDate(x.at)}, ${x.mins} min, ${x.sets.length} sets</span></span>${I.chev}</button>`).join('');
  return h;
}

}

   <p class="note">Timers keep counting from the real clock, so if you leave and come back, they show the right time. Phones pause web apps when the screen locks, so keep screen awake on during workouts.</p>
   <h2 class="sec-t">Appearance</h2>
   <div class="srow"><div class="st">Theme</div><div class="mini-seg">${['system','light','dark'].map(t=>`<button class="${S.theme===t?'on':''}" data-a="theme" data-v="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>
   <h2 class="sec-t">Your data</h2>

/* ============ RENDER ============ */
function render(scroll=true){
  const top=V.stack[V.stack.length-1];
  document.body.classList.toggle('tabs', !top);
  let html;
  if(!top) html = ({today:vToday,programs:vPrograms,progress:vProgress,settings:vSettings})[V.tab]();
  else html = ({program:vProgram,plan:vPlan,workout:vWorkout,player:vPlayer,summary:vSummary})[top.s](top);
  $('#main').innerHTML = html;
  $('#tabs').innerHTML = [['today','Today',I.tToday],['programs','Programs',I.tProg],['progress','Progress',I.tStats],['settings','Settings',I.tSet]]
    .map(([k,l,ic])=>`<button class="tab ${V.tab===k?'on':''}" data-a="tab" data-t="${k}" aria-current="${V.tab===k}">${ic}${l}</button>`).join('');
  if(scroll) window.scrollTo(0,0);
  if(top && top.s==='player') paintTimer();
  applyTheme();
}
function applyTheme(){ const r=document.documentElement; if(S.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.theme); }
function push(o){ V.stack.push(o); render(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2400); }
function openSheet(html){ $('#sheet').innerHTML='<div class="grab"></div>'+html; $('#sheet').classList.add('show'); $('#scrim').classList.add('show'); }
function closeSheet(){ $('#sheet').classList.remove('show'); $('#scrim').classList.remove('show'); }

/* ============ SESSION / TIMER ============ */
function startWorkout(week, day){
  const a=S.active, wd=weekDays(a.id,a.days)[day-1];
  const items=buildDay(a.id,a.loc,wd.key,week);
  const steps=[]; items.forEach((it,i)=>{ for(let s=1;s<=it.sets;s++){ steps.push({k:'w',i,s}); steps.push({k:'r',i,s}); } }); steps.pop();
  S.session={key:`w${week}d${day}`,week,day,prog:a.id,loc:a.loc,dayKey:wd.key,title:D[wd.key].n,items,steps,idx:0,started:Date.now(),logs:{},timer:null};
  save(); unlockAudio(); requestWake();
  V.stack=[{s:'player'}]; render();
}
function startTimer(ms, auto=true){ S.session.timer={total:ms,left:ms,end:Date.now()+ms,paused:!auto,lastBeep:null,half:false}; }
function goStep(n){
  const s=S.session;
  if(n>=s.steps.length){ finish(); return; }
  if(n<0) n=0;
  s.idx=n; s.timer=null;
  const st=s.steps[n], it=s.items[st.i], e=EXM[it.id];
  if(st.k==='r') startTimer(it.rest*1000, true);
  else if(e.t==='s') startTimer(it.sec*1000*(e.u?2:1), false);
  save(); render();
}
function remaining(){ const t=S.session&&S.session.timer; if(!t) return 0; return t.paused? t.left : t.end-Date.now(); }
function paintTimer(){
  const s=S.session; if(!s) return;
  const el=$('#elapsed'); if(el) el.textContent=mmss((Date.now()-s.started)/1000);
  const t=s.timer; if(!t) return;
  const left=Math.max(0,remaining());
  const n=$('#tnum'); if(n) n.textContent=mmss(Math.ceil(left/1000));
  const r=$('#ringfg'); if(r) r.style.strokeDashoffset = C*(1-left/t.total);
  const st=s.steps[s.idx], e=EXM[s.items[st.i].id];
  const sh=$('#switchhint'); if(sh && st.k==='w' && e.u){ sh.textContent = t.paused&&t.left===t.total ? '' : (left > t.total/2 ? 'First side' : 'Switch sides'); }
}
function loop(){
  const s=S.session; const top=V.stack[V.stack.length-1];
  if(s && top && top.s==='player'){
    paintTimer();
    const t=s.timer;
    if(t && !t.paused){
      const left=t.end-Date.now(), sec=Math.ceil(left/1000);
      const st=s.steps[s.idx], e=EXM[s.items[st.i].id];
      if(sec<=3 && sec>0 && t.lastBeep!==sec){ t.lastBeep=sec; tick3(); }
      if(st.k==='w' && e.u && !t.half && left<=t.total/2){ t.half=true; tone(880,.25); if(S.vib&&navigator.vibrate) navigator.vibrate(150); }
      if(left<=0) timerDone();
    }
  }
}
function timerDone(){
  const s=S.session, st=s.steps[s.idx], it=s.items[st.i];
  s.timer=null; chime();
  if(st.k==='r'){
    const nst=s.steps[s.idx+1], nit=s.items[nst.i];
    if(document.hidden) notify('Rest is over', `Next: ${EXM[nit.id].n}, set ${nst.s} of ${nit.sets}`);
  } else {
    s.logs[`${st.i}-${st.s}`]={w:null,r:null,sec:it.sec,u:S.units};
  }
  goStep(s.idx+1);
}
function finish(){
  const s=S.session, a=S.active;
  const sets=Object.entries(s.logs).map(([k,v])=>{ const [i,set]=k.split('-').map(Number); const it=s.items[i]; return {i,set,id:it.id,n:EXM[it.id].n,w:v.w,r:v.r,sec:v.sec,u:v.u}; })
    .sort((x,y)=>x.i-y.i||x.set-y.set);
  const vol=sets.reduce((a2,x)=>a2+(x.w||0)*(x.r||0),0);
  // personal bests vs history
  const prs=[]; const seen={};
  sets.forEach(x=>{ if(!x.w) return; if(!seen[x.id]||x.w>seen[x.id]) seen[x.id]=x.w; });
  Object.entries(seen).forEach(([id,w])=>{
    let prev=0; S.history.forEach(hh=>hh.sets.forEach(y=>{ if(y.id===id && (y.u||hh.u)===S.units && y.w>prev) prev=y.w; }));
    if(prev>0 && w>prev) prs.push({id,n:EXM[id].n,w});
  });
  const h={id:Date.now().toString(36),at:Date.now(),prog:s.prog,week:s.week,day:s.day,title:s.title,mins:Math.max(1,Math.round((Date.now()-s.started)/60000)),sets,vol,u:S.units};
  if(sets.length){
    S.history.unshift(h);
    if(a && a.id===s.prog && a.loc===s.loc) a.done[s.key]=Date.now();
    sets.forEach(x=>{ S.last[x.id]= x.sec? {sec:x.sec} : {w:x.w,r:x.r,u:x.u}; });
  }
  S.session=null; releaseWake(); save();
  if(!sets.length){ V.stack=[]; V.tab='today'; render(); toast('Workout ended. Nothing was logged.'); return; }
  V.stack=[{s:'summary',h,prs}]; render();
}
function readInputs(){
  const w=parseFloat(($('#inW')||{}).value); const r=parseInt(($('#inR')||{}).value,10);
  return {w:isNaN(w)?null:w, r:isNaN(r)?null:r};
}

/* ============ ACTIONS ============ */
const A = {
  tab:d=>{ V.tab=d.t; V.stack=[]; render(); },
  back:()=>{ V.stack.pop(); render(); },
  closeSheet,
  openProg:d=>{ const a=S.active; const same=a&&a.id===d.id; push({s:'program',id:d.id,loc:same?a.loc:(a?a.loc:'gym'),days:same?a.days:(a?a.days:4)}); },
  setLoc:d=>{ V.stack[V.stack.length-1].loc=d.v; render(false); },
  setDays:d=>{ V.stack[V.stack.length-1].days=+d.v; render(false); },
  startProg:()=>{
    const t=V.stack[V.stack.length-1], a=S.active;
    if(a && a.id===t.id && a.loc===t.loc && a.days===t.days){ V.stack=[]; V.tab='today'; render(); return; }
    if(a && a.id===t.id){ // same program, new settings: keep progress by week
      const nx=nextWorkout(); const doneWeeks = nx? nx.week-1 : WEEKS;
      const done={}; for(let w=1;w<=doneWeeks;w++) weekDays(t.id,t.days).forEach(d=>{ if(!d.rest) done[`w${w}d${d.day}`]=Date.now(); });
      S.active={id:t.id,loc:t.loc,days:t.days,started:a.started,done}; save(); V.stack=[]; V.tab='today'; render(); toast('Program updated'); return;
    }
    if(a){ openSheet(`<h3 class="h2">Switch to ${esc(P[t.id].n)}?</h3><p class="muted" style="margin:8px 0 18px">Your current program progress resets. Your workout history and personal bests stay.</p>
      <button class="btn" data-a="confirmProg">Switch program</button><button class="btn ghost" data-a="closeSheet">Keep current program</button>`); return; }
    A.confirmProg();
  },
  confirmProg:()=>{ const t=V.stack[V.stack.length-1]; closeSheet(); S.active={id:t.id,loc:t.loc,days:t.days,started:Date.now(),done:{}}; save(); V.stack=[]; V.tab='today'; render(); toast(`${P[t.id].n} started`); },
  restartProg:()=>{ S.active.done={}; S.active.started=Date.now(); save(); render(); },
  openPlan:()=>{ const nx=nextWorkout(); push({s:'plan',open:[nx?nx.week:1]}); },
  toggleWeek:d=>{ const t=V.stack[V.stack.length-1], w=+d.w; t.open = t.open.includes(w)? t.open.filter(x=>x!==w) : [...t.open,w]; render(false); },
  openDay:d=>push({s:'workout',week:+d.w,day:+d.d}),
  startW:d=>{
    if(S.session){ openSheet(`<h3 class="h2">You have a workout in progress</h3><p class="muted" style="margin:8px 0 18px">${esc(S.session.title)}, week ${S.session.week}. Starting a new one discards it.</p>
      <button class="btn" data-a="resume">Resume that workout</button><button class="btn ghost" data-a="forceStart" data-w="${d.w}" data-d="${d.d}">Start new workout</button>`); return; }
    startWorkout(+d.w,+d.d);
  },
  forceStart:d=>{ closeSheet(); S.session=null; startWorkout(+d.w,+d.d); },
  resume:()=>{ closeSheet(); unlockAudio(); requestWake(); V.stack=[{s:'player'}]; render(); },
  doneSet:()=>{ const s=S.session, st=s.steps[s.idx]; const v=readInputs(); s.logs[`${st.i}-${st.s}`]={w:v.w,r:v.r,u:S.units}; unlockAudio(); goStep(s.idx+1); },
  skipStep:()=>{ const s=S.session; let n=s.idx+1; while(n<s.steps.length && s.steps[n].k==='r') n++; goStep(n); },
  prevStep:()=>{ const s=S.session; let n=s.idx-1; while(n>0 && s.steps[n].k==='r') n--; goStep(Math.max(0,n)); },
  skipRest:()=>{ goStep(S.session.idx+1); },
  startT:()=>{ unlockAudio(); const t=S.session.timer; if(!t){ return; } t.paused=false; t.end=Date.now()+t.left; save(); render(false); },
  pauseT:()=>{ const t=S.session.timer; if(!t) return; if(t.paused){ t.paused=false; t.end=Date.now()+t.left; } else { t.paused=true; t.left=Math.max(0,t.end-Date.now()); } save(); render(false); },
  adj:d=>{ const t=S.session.timer; if(!t) return; const v=(+d.v)*1000; if(t.paused){ t.left=Math.max(1000,t.left+v); } else { t.end=Math.max(Date.now()+1000,t.end+v); } t.total=Math.max(t.total+v, t.paused?t.left:t.end-Date.now()); t.lastBeep=null; save(); paintTimer(); },
  doneTimed:()=>{ const s=S.session, st=s.steps[s.idx], it=s.items[st.i]; const t=s.timer; const did = t? Math.round(((t.total-(t.paused?t.left:Math.max(0,t.end-Date.now())))/1000)/(EXM[it.id].u?2:1)) : it.sec; s.logs[`${st.i}-${st.s}`]={w:null,r:null,sec:Math.max(1,did)||it.sec,u:S.units}; goStep(s.idx+1); },
  wStep:d=>{ const el=$('#inW'); const step=S.units==='kg'?2.5:5; const cur=parseFloat(el.value)||0; el.value=Math.max(0,+(cur+(+d.v)*step).toFixed(1)); },
  rStep:d=>{ const el=$('#inR'); const cur=parseInt(el.value,10)||0; el.value=Math.max(0,cur+(+d.v)); },
  endW:()=>openSheet(`<h3 class="h2">End workout?</h3><p class="muted" style="margin:8px 0 18px">Sets you logged are saved to your history.</p>
    <button class="btn" data-a="saveEnd">Save and finish</button><button class="btn ghost" data-a="discard">Discard workout</button><button class="btn ghost" data-a="closeSheet">Keep going</button>`),
  saveEnd:()=>{ closeSheet(); finish(); },
  discard:()=>{ closeSheet(); S.session=null; releaseWake(); save(); V.stack=[]; render(); toast('Workout discarded'); },
  sumDone:()=>{ V.stack=[]; V.tab='today'; render(); },
  swapOpen:d=>{
    let p, loc, cur, ctx=d.ctx;
    if(ctx==='player'){ const s=S.session, st=s.steps[s.idx]; const it=s.items[st.i]; p=it.p; loc=s.loc; cur=it.id; A._swap={ctx,i:st.i}; }
    else { const a=S.active, wd=weekDays(a.id,a.days)[d.d-1]; const it=buildDay(a.id,a.loc,wd.key,+d.w)[+d.i]; p=it.p; loc=a.loc; cur=it.id; A._swap={ctx,i:+d.i,dayKey:wd.key}; }
    const opts=EX.filter(e=>e.p===p && e.loc.includes(lc(loc)));
    openSheet(`<h3 class="h2">Swap exercise</h3><p class="muted" style="margin:6px 0 8px">Same movement, using ${loc==='home'?'home':'gym'} equipment. Your choice is kept for future weeks.</p>`+
      opts.map(e=>`<button class="opt ${e.id===cur?'cur':''}" data-a="swapPick" data-id="${e.id}"><b>${esc(e.n)}${e.id===cur?' (current)':''}</b><span>${esc(e.eq)}. ${esc(e.m)}.</span></button>`).join(''));
  },
  swapPick:d=>{
    const sw=A._swap; closeSheet();
    if(sw.ctx==='player'){ const s=S.session; const it=s.items[sw.i]; it.id=d.id; S.swaps[`${s.prog}|${s.loc}|${s.dayKey}|${it.slot}`]=d.id; if(s.steps[s.idx].k==='w'){ save(); goStep(s.idx); toast(`Swapped to ${EXM[d.id].n}`); return; } }
    else { const a=S.active; S.swaps[`${a.id}|${a.loc}|${sw.dayKey}|${sw.i}`]=d.id; }
    save(); render(false); toast(`Swapped to ${EXM[d.id].n}`);
  },
  histOpen:d=>{
    const x=S.history.find(h=>h.id===d.id); if(!x) return;
    const groups={}; x.sets.forEach(s=>{(groups[s.n]=groups[s.n]||[]).push(s);});
    openSheet(`<h3 class="h2">${esc(x.title)}</h3><p class="muted" style="margin:4px 0 10px">${fmtDate(x.at)}, ${x.mins} min, ${fmtNum(x.vol)} ${x.u}</p>`+
      Object.entries(groups).map(([n,arr])=>`<div class="opt"><b>${esc(n)}</b><span>${arr.map(s=>s.sec?`${s.sec}s`:`${s.w!=null?s.w+' × ':''}${s.r??'—'}`).join(',  ')}</span></div>`).join('')+
      `<button class="btn ghost" style="margin-top:18px" data-a="histDel" data-id="${x.id}">Delete this workout</button>`);
  },
  histDel:d=>{ S.history=S.history.filter(h=>h.id!==d.id); save(); closeSheet(); render(false); toast('Workout deleted'); },
  tog:async d=>{
    if(d.k==='notify'){
      if(S.notify && 'Notification' in window && Notification.permission==='granted'){ S.notify=false; save(); render(false); return; }
      if(!('Notification' in window)){ toast(isIOS?'Add to Home Screen first':'Notifications not supported here'); return; }
      try{ const p=await Notification.requestPermission(); S.notify = p==='granted'; }catch(e){ S.notify=false; }
      save(); render(false); if(S.notify){ notify('Rest alerts are on','You will see this when your rest ends.'); } return;
    }
    S[d.k]=!S[d.k]; save(); render(false);
    if(d.k==='sound' && S.sound){ unlockAudio(); tone(880,.15); }
  },
  units:d=>{ S.units=d.v; save(); render(false); },
  theme:d=>{ S.theme=d.v; save(); render(false); },
  export:()=>{
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`strongbloom-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); toast('Backup downloaded');
  },
  import:()=>$('#importFile').click(),
  reset:()=>openSheet(`<h3 class="h2">Erase all data?</h3><p class="muted" style="margin:8px 0 18px">This removes your program, history and settings from this device. It cannot be undone.</p>
    <button class="btn" style="background:#C2334E" data-a="resetYes">Erase everything</button><button class="btn ghost" data-a="closeSheet">Cancel</button>`),
  resetYes:()=>{ S=Object.assign({},DEF,{swaps:{},history:[],last:{}}); save(); closeSheet(); V={tab:'today',stack:[]}; render(); toast('All data erased'); }
};

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const fn=A[el.dataset.a]; if(fn){ e.preventDefault(); fn(el.dataset, el); }
});
$('#importFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.history)) throw 0; S=Object.assign({},DEF,d); save(); V={tab:'today',stack:[]}; render(); toast('Backup restored'); }catch(err){ toast('That file is not a StrongBloom backup'); } };
  r.readAsText(f); e.target.value='';
});
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){ const top=V.stack[V.stack.length-1]; if(S.session && top && top.s==='player'){ requestWake(); loop(); } }
});
document.addEventListener('pointerdown', ()=>{ if(S.session) unlockAudio(); }, {passive:true});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
setInterval(loop, 250);
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

// validate stored program shape
if(S.active && (!P[S.active.id] || !LAYOUT[S.active.days])) S.active=null;
if(S.session && (!S.session.steps || !S.session.items)) S.session=null;
render();
</script>
</body>
</html>
